<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Completed Exams</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f7f7f7;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #controls {
            text-align: center;
            margin-bottom: 25px;
        }

        #controls input {
            margin-right: 10px;
        }

        #mainContainer {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        #leftColumn, #rightColumn {
            width: 48%;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px 8px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background: #eaeaea;
        }

        .titleRow {
            text-align: right;
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #processing {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        #errorMessage {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            color: red;
            display: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="daily.js"></script>
</head>

<body>

    <h1>Monthly Completed Exams</h1>

    <div id="controls">
        <input type="file" id="dailyFile" accept=".xlsx,.xls,.csv">
        <button onclick="runDailySummary()">Generate</button>
        <button onclick="downloadOutput()">Download Output</button>
    </div>

    <div id="processing">Processing… please wait</div>

    <div id="errorMessage">Error: Could not generate tables. Please check your file.</div>

    <div id="mainContainer">
        <div id="leftColumn"></div>
        <div id="rightColumn"></div>
    </div>

</body>
</html>
